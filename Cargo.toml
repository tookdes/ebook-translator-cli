[package]
name = "ebook-translator"
version = "0.1.1"
edition = "2024"
description = "Single-binary command-line ebook translator"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dom_query = { version = "0.28", default-features = false }
futures-util = "0.3"
html5ever = "0.39"
httpdate = "1"
indicatif = "0.18"
libc = "0.2"
md5 = "0.8"
percent-encoding = "2"
quick-xml = "0.41"
rand = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
wait-timeout = "0.2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

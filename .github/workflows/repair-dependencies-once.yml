name: repair-dependencies-once

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/epub.rs"
      - ".github/workflows/repair-dependencies-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-audit

      - name: Refresh vulnerable dependencies
        run: |
          cargo update -p quinn-proto --precise 0.11.18
          cargo update -p rustls --precise 0.23.46
          cargo update -p tokio --precise 1.53.3
          cargo update -p zip

      - name: Format
        run: cargo fmt

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Audit
        run: cargo audit --deny warnings

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src/config.rs
          git commit -m "chore: refresh patched dependencies"
          git push

name: one-shot-lockfile

on:
  push:
    branches: ["fix/windows-same-file"]
    paths:
      - ".github/workflows/lockfile-fix.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-same-file
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Update lockfile
        run: cargo check
      - name: Format
        run: cargo fmt
      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src Cargo.toml
          git commit -m "chore: update lockfile and format"
          git push origin HEAD:fix/windows-same-file

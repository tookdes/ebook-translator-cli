name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install binary
        run: cargo install --locked --path . --root "$RUNNER_TEMP/ebook-translator-install"
      - name: Smoke test installed CLI
        run: |
          "$RUNNER_TEMP/ebook-translator-install/bin/ebook-translator" --version
          test "$("$RUNNER_TEMP/ebook-translator-install/bin/ebook-translator" --version)" = "ebook-translator 0.1.1"

  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --deny warnings

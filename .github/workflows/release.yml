name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"
            exit 1
          }
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@cargo-audit
      - name: Dependency audit
        run: cargo audit --deny warnings

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-armhf
            os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            cross: true
          - name: linux-armhf-static
            os: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            musl: true
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install armhf glibc cross compiler
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
          echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"

      - name: Install Zig
        if: matrix.musl == true
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.musl == true
        run: cargo install cargo-zigbuild --locked

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        if: matrix.musl != true
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build static release binary
        if: matrix.musl == true
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Smoke test native binary
        if: matrix.cross != true && matrix.musl != true
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = Windows ] && ext=".exe"
          "target/${{ matrix.target }}/release/ebook-translator${ext}" --version

      - name: Verify static binary
        if: matrix.musl == true
        shell: bash
        run: |
          file "target/${{ matrix.target }}/release/ebook-translator"
          if ldd "target/${{ matrix.target }}/release/ebook-translator" 2>&1 | grep -qvE 'not a dynamic executable|statically linked'; then
            echo 'Binary is not fully static'
            exit 1
          fi
          if readelf --version-info "target/${{ matrix.target }}/release/ebook-translator" 2>/dev/null | grep -q 'GLIBC_'; then
            echo 'Binary still has GLIBC symbol requirements'
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [ "${{ runner.os }}" = Windows ] && ext=".exe"
          src="target/${{ matrix.target }}/release/ebook-translator${ext}"
          dst="dist/ebook-translator-${{ matrix.name }}${ext}"
          cp "$src" "$dst"
          chmod +x "$dst" || true
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$dst" > "$dst.sha256"
          else
            shasum -a 256 "$dst" > "$dst.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ebook-translator-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: dist/*
